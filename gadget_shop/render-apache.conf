ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options -Indexes
    AllowOverride All
</Directory>

<FilesMatch "^(db|db\.render|db\.example|auth|cors|reset_helpers|mail_config|test_db|setup_reset_mail|check_reset_setup|password_reset_worker)\.php$">
    Require all denied
</FilesMatch>

<FilesMatch "^(Dockerfile|render-apache\.conf|\.dockerignore)$">
    Require all denied
</FilesMatch>
